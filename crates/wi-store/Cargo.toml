[package]
name = "wi-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rusqlite.workspace = true
serde.workspace = true
# float_roundtrip: journal snapshots carry REAL values (a measured BPM) as
# JSON text, and undo must put back the same f64, bit for bit (F5).
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
wwav-ids.workspace = true

[dev-dependencies]
rand.workspace = true
tempfile.workspace = true
