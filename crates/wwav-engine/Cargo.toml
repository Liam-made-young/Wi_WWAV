[package]
name = "wwav-engine"
version.workspace = true
edition.workspace = true
# cpal 0.18 asks for 1.85; 1.89 is what wwav-session already needs.
rust-version = "1.89"
license.workspace = true
publish.workspace = true
description = "wwav-engine in Rust: the server of docs/ENGINE.md, on a sound card or the null device"

[lib]
name = "wwav_engine"
path = "src/lib.rs"

[[bin]]
name = "wwav-engine"
path = "src/main.rs"

[dependencies]
wwav-wire.workspace = true
wwav-formats.workspace = true
wwav-dsp.workspace = true
wwav-ids.workspace = true
wwav-decode = { path = "../wwav-decode" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
libc = "0.2"
libm = "0.2.16"
rtrb = "0.3"
cpal = "0.18"

[dev-dependencies]
tempfile.workspace = true
