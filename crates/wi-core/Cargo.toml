[package]
name = "wi-core"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
publish.workspace = true
description = "The app's Rust core: the library, undo, the listening player, the engine supervisor, sync and the account, with no Tauri in it (docs/COMMANDS.md)"

[dependencies]
wi-store.workspace = true
wi-heat.workspace = true
wi-heat-store = { path = "../wi-heat-store" }
# For the words of the two mail jobs the core runs (mail_cmd.rs).
wi-mcp = { path = "../wi-mcp" }
wwav-formats.workspace = true
wwav-wire.workspace = true
wwav-ids.workspace = true
wwav-tokens.workspace = true
wi-formula.workspace = true
wi-wiki.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
rand.workspace = true
rusqlite.workspace = true
base64 = "0.22"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
libc = "0.2"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# Space reads links apart (docs/SPACE.md); ureq already brings this crate in.
url = "2"
zip = { version = "8", default-features = false }
pdf-extract = "0.12.1"
pulldown-cmark = { version = "0.13.1", default-features = false, features = ["html"] }
fountain = "0.1.12"
nom = "5"
lopdf = { version = "0.42.0", default-features = false }
rustybuzz = "0.20.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
imageproc = { version = "=0.25.0", default-features = false }
resvg = { version = "=0.45.1", default-features = false, features = ["text", "raster-images"] }
tiny-skia = "=0.11.4"
svgtypes = "=0.15.3"
xmlwriter = "=0.1.0"
roxmltree = "=0.20.0"
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true
