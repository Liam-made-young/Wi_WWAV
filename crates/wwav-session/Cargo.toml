[package]
name = "wwav-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The .wwavsession package: session.json, its undo journal, autosave and Send session (docs/SPEC.md 6.5)"

[dependencies]
wwav-ids.workspace = true
serde.workspace = true
# float_roundtrip: a float read back from session.json is the float written,
# so reopening a session never changes a byte.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
base64 = "0.22"
reflink-copy = "0.1"
zip = { version = "8", default-features = false }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
