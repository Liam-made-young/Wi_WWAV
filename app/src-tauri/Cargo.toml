[package]
name = "wi-wwav"
description = "Wi_WWAV: one desktop app with three views"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The shell is a library so its tests can build it on Tauri's mock runtime;
# main.rs only calls run(). The name differs from the binary's so their build
# outputs never collide.
[lib]
name = "wi_wwav_app"
path = "src/lib.rs"

[[bin]]
name = "wi-wwav"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is what lets a window hold more than one web view: Space opens
# each page in a web view of its own, over the sky (docs/SPACE.md 11).
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
wi-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The OS secret store: Keychain on macOS, Credential Manager on Windows, the
# Secret Service (GNOME Keyring, KWallet) elsewhere (docs/SPEC.md 9.8).
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# A page's picture travels to the window as text (space_pages.rs).
base64 = "0.22"

# The Mac takes that picture with WebKit's own snapshot, asked for by name
# (space_picture.rs). Tauri's web view already brings both crates in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = { workspace = true }
